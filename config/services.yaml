services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Emporiqa\SyliusPlugin\Service\WebhookSender:
        arguments:
            $webhookUrl: '%emporiqa.webhook_url%'
            $storeId: '%emporiqa.store_id%'
            $webhookSecret: '%emporiqa.webhook_secret%'

    Emporiqa\SyliusPlugin\Service\WebhookSenderInterface: '@Emporiqa\SyliusPlugin\Service\WebhookSender'

    Emporiqa\SyliusPlugin\Service\WebhookEventQueue: ~

    Emporiqa\SyliusPlugin\Service\ChannelMappingResolver:
        arguments:
            $channelRepository: '@?sylius.repository.channel'

    Emporiqa\SyliusPlugin\Service\ProductFormatter:
        arguments:
            $enabledLanguages: '%emporiqa.enabled_languages%'
            $baseUrl: '%emporiqa.base_url%'
            $brandAttributeCode: '%emporiqa.brand_attribute_code%'
            $mediaBasePath: '%emporiqa.media_base_path%'
            $minOrderQuantityAttribute: '%emporiqa.min_order_quantity_attribute%'
            $maxOrderQuantityAttribute: '%emporiqa.max_order_quantity_attribute%'
            $conditionAttribute: '%emporiqa.condition_attribute%'
            $virtualAttribute: '%emporiqa.virtual_attribute%'

    Emporiqa\SyliusPlugin\Service\ProductFormatterInterface: '@Emporiqa\SyliusPlugin\Service\ProductFormatter'

    Emporiqa\SyliusPlugin\Service\VariantStockFormatter: ~

    Emporiqa\SyliusPlugin\Service\VariantStockFormatterInterface: '@Emporiqa\SyliusPlugin\Service\VariantStockFormatter'

    Emporiqa\SyliusPlugin\Service\PageUrlResolver: ~

    Emporiqa\SyliusPlugin\Service\PageUrlResolverInterface: '@Emporiqa\SyliusPlugin\Service\PageUrlResolver'

    Emporiqa\SyliusPlugin\Service\PageFormatter:
        arguments:
            $enabledLanguages: '%emporiqa.enabled_languages%'

    Emporiqa\SyliusPlugin\Service\PageFormatterInterface: '@Emporiqa\SyliusPlugin\Service\PageFormatter'

    Emporiqa\SyliusPlugin\Service\OrderProvider: ~

    Emporiqa\SyliusPlugin\Service\OrderProviderInterface: '@Emporiqa\SyliusPlugin\Service\OrderProvider'

    Emporiqa\SyliusPlugin\EventSubscriber\ProductEventSubscriber:
        arguments:
            $syncEnabled: '%emporiqa.sync.products%'

    Emporiqa\SyliusPlugin\EventListener\VariantStockDoctrineListener:
        arguments:
            $syncEnabled: '%emporiqa.sync.products%'
            $stockSyncEnabled: '%emporiqa.sync.stock%'

    Emporiqa\SyliusPlugin\EventListener\PageDoctrineListener:
        arguments:
            $pageEntityClasses: '%emporiqa.page_entity_classes%'
            $syncEnabled: '%emporiqa.sync.pages%'

    Emporiqa\SyliusPlugin\Twig\EmporiqaExtension:
        arguments:
            $storeId: '%emporiqa.store_id%'
            $webhookUrl: '%emporiqa.webhook_url%'
            $webhookSecret: '%emporiqa.webhook_secret%'
            $cartEnabled: '%emporiqa.cart.enabled%'
            $channelContext: '@?Sylius\Component\Channel\Context\ChannelContextInterface'
            $currencyContext: '@?Sylius\Component\Currency\Context\CurrencyContextInterface'

    Emporiqa\SyliusPlugin\Command\SyncProductsCommand: ~

    Emporiqa\SyliusPlugin\Command\SyncPagesCommand:
        arguments:
            $pageEntityClasses: '%emporiqa.page_entity_classes%'

    Emporiqa\SyliusPlugin\Command\SyncAllCommand: ~

    Emporiqa\SyliusPlugin\Command\TestConnectionCommand:
        arguments:
            $productRepository: '@sylius.repository.product'

    Emporiqa\SyliusPlugin\Controller\OrderTrackingController:
        arguments:
            $webhookSecret: '%emporiqa.webhook_secret%'
            $enabled: '%emporiqa.order_tracking.enabled%'
        tags: ['controller.service_arguments']

    Emporiqa\SyliusPlugin\Controller\CartController:
        arguments:
            $cartContext: '@sylius.context.cart'
            $orderModifier: '@Sylius\Component\Order\Modifier\OrderModifierInterface'
            $orderItemQuantityModifier: '@Sylius\Component\Order\Modifier\OrderItemQuantityModifierInterface'
            $orderItemFactory: '@sylius.factory.order_item'
            $variantRepository: '@sylius.repository.product_variant'
            $entityManager: '@doctrine.orm.default_entity_manager'
            $router: '@router'
            $logger: '@logger'
            $csrfTokenManager: '@?Symfony\Component\Security\Csrf\CsrfTokenManagerInterface'
            $eventDispatcher: '@?Symfony\Contracts\EventDispatcher\EventDispatcherInterface'
            $enabled: '%emporiqa.cart.enabled%'
            $mediaBasePath: '%emporiqa.media_base_path%'
        tags: ['controller.service_arguments']

    Emporiqa\SyliusPlugin\EventSubscriber\OrderCompleteSubscriber: ~
